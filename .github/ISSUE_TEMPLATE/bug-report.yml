name: Reporte de Bug
description: Reporta un error técnico en CanchaYa que NO es de usabilidad ni accesibilidad.
title: "[Bug] "
labels: ["bug"]
assignees: []

body:
  - type: input
    id: nombre
    attributes:
      label: "Tu nombre completo"
      placeholder: "Ej: María Pérez Gómez"
    validations:
      required: true

  - type: dropdown
    id: tipo
    attributes:
      label: "Tipo de error"
      options:
        - "La página no carga"
        - "Error en la consola del navegador"
        - "Comportamiento inesperado"
        - "Otro"
    validations:
      required: true

  - type: input
    id: pantalla
    attributes:
      label: "Pantalla afectada"
      placeholder: "Ej: /reservar, /cancha-detalle"
    validations:
      required: true

  - type: textarea
    id: pasos
    attributes:
      label: "Pasos para reproducir"
      description: "Lista numerada."
      placeholder: "1.\n2.\n3."
    validations:
      required: true

  - type: textarea
    id: observado
    attributes:
      label: "Resultado observado"
    validations:
      required: true

  - type: textarea
    id: esperado
    attributes:
      label: "Resultado esperado"
    validations:
      required: true

  - type: input
    id: navegador
    attributes:
      label: "Navegador y versión"
      placeholder: "Ej: Chrome 118, Firefox 119, Safari 17"
    validations:
      required: true

  - type: textarea
    id: evidencia
    attributes:
      label: "Evidencia (opcional)"
      description: "Capturas o mensajes de la consola."
